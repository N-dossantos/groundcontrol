name: Recordatorio de carritos abandonados

on:
  # Cron pausado: la ruta todavía no está desplegada en producción, así que
  # cada corrida fallaría. DESCOMENTAR AL LANZAR (Etapa 5 de
  # docs/PLAN_POR_ETAPAS.md), junto con el de liberar-reservas.yml.
  # schedule:
  #   - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de carritos abandonados
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "${SITE_URL}/api/cron/carritos-abandonados" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
