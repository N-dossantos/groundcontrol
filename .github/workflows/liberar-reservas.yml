name: Liberar reservas de stock vencidas

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  liberar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de liberación de reservas
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "${SITE_URL}/api/cron/liberar-reservas" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
